name: Verify Life OS

on:
  pull_request:
    branches: [main, feature/consumer-experience]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: life-os-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test -- --maxWorkers=2
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      - run: npm run test:bundle
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      # Retiring the workbook: the career workflows again, with Sheets off.
      - run: npm run test:e2e -- tests/e2e/y-career-migration.spec.ts
        env:
          LIFE_OS_SHEETS_DISABLED: "1"
      - run: npm run test:requests -- --output=request-results
      - name: Retain synthetic dashboard measurements
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dashboard-validation
          path: |
            test-results/**/dashboard-performance.json
            test-results/**/personal-*.png
            test-results/**/warm-*.png
            test-results/**/today-populated-*.png
            request-results/**/request-counts.json
          if-no-files-found: ignore
          retention-days: 7
